{%- assign repo = include.repository -%}
<a class="repo-card" href="https://github.com/{{ repo.owner }}/{{ repo.name }}">
  <div class="repo-card-title">
    <i class="fab fa-github"></i>
    <span class="repo-card-owner">{{ repo.owner }}/</span>{{ repo.name }}
  </div>
  {%- if repo.description %}
  <div class="repo-card-desc">{{ repo.description }}</div>
  {%- endif %}
  {%- if repo.language %}
  <div class="repo-card-meta">
    <span class="repo-lang"><span class="repo-lang-dot" style="background-color: {{ repo.language_color | default: '#858585' }};"></span>{{ repo.language }}</span>
  </div>
  {%- endif %}
</a>
